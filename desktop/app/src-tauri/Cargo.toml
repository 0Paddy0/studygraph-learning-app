[package]
name = "studygraph_desktop"
version = "0.1.0"
description = "StudyGraph standalone desktop app"
edition = "2021"
license = "UNLICENSED"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studygraph_core = { path = "../../../shared/rust-core" }
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-dialog = "2"
