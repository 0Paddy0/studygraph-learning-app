[package]
name = "studygraph_core"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "studygraph_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
pretty_assertions = "1"
